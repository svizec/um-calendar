name: Pages

on:
  push:
    branches: [main]
    paths: ['web/**', 'src/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test
      - name: Build site (web/ at the root, browser-safe src/ next to it)
        run: |
          mkdir -p _site/src
          cp -r web/. _site/
          cp src/index.js src/ics.js src/wise.js src/clean.js src/render.js src/config.js _site/src/
      - name: Version asset URLs (GitHub Pages lets browsers cache files for 10 minutes)
        run: |
          v="${GITHUB_SHA::8}"
          sed -i -E "s#(href=\"style\.css)#\1?v=$v#; s#(src=\"app\.js)#\1?v=$v#" _site/index.html
          sed -i -E "s#\./src/index\.js#./src/index.js?v=$v#g" _site/app.js
          sed -i -E "s#from '\./([a-z]+)\.js'#from './\1.js?v=$v'#g" _site/src/*.js
          grep -c "?v=$v" _site/index.html _site/app.js _site/src/*.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
