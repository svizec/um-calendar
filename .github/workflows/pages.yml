name: Pages

on:
  push:
    branches: [main]
    paths: ['web/**', 'src/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test
      - name: Build site (web/ at the root, browser-safe src/ next to it)
        run: |
          mkdir -p _site/src
          cp -r web/. _site/
          cp src/index.js src/ics.js src/wise.js src/clean.js src/render.js src/config.js _site/src/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
